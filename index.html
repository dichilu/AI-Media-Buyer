<title>AI 广告投手 · 产品原型（EIOT 事业线）</title>
<style>
:root{
 --bg:#f3f4f7;--pn:#fff;--pn2:#fafbfc;--bd:#e3e6ec;--bd2:#ccd2dc;
 --tx:#16191d;--tx2:#586170;--tx3:#8a93a2;
 --ac:#2f5fd0;--acb:#e9f0fd;--ok:#1a7a4f;--okb:#e6f4ec;
 --wn:#96600a;--wnb:#fdf2df;--dg:#ad3434;--dgb:#fbebeb;--pu:#5b47ab;--pub:#efecfa;
 --tm:#5b5fc7;--tmb:#f0f0fb;--adv:#004280;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.6 "Microsoft YaHei","PingFang SC","Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--tx)}
body.en{font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif}
body.tw{font-family:"Microsoft JhengHei","PingFang TC","Segoe UI",Arial,sans-serif}
.app{max-width:1240px;margin:0 auto;background:var(--pn);min-height:100vh;box-shadow:0 0 0 1px var(--bd)}

.top{background:#fff;color:var(--tx);padding:0 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
 min-height:58px;border-bottom:1px solid var(--bd)}
.top img{height:30px;display:block}
.top .nm{font-weight:600;font-size:15px;color:var(--tx)}
.top .sub{font-size:12px;color:var(--tx3)}
.top .sp{flex:1}
.top .bu{font-size:12px;background:#eff1f4;padding:3px 10px;border-radius:20px;color:var(--tx2)}
.top a{color:var(--adv);font-size:12.5px;text-decoration:none;border:1px solid #b9cde3;
 padding:4px 12px;border-radius:6px;white-space:nowrap}
.top a:hover{background:#eaf0fa}
.top a.pri{background:var(--adv);color:#fff;border-color:var(--adv);font-weight:600}
.top a.pri:hover{opacity:.88;background:var(--adv)}
.top select.lang{font:inherit;font-size:12.5px;padding:5px 8px;border:1px solid #b9cde3;border-radius:6px;
 background:#fff;color:var(--adv);cursor:pointer;min-width:104px}

.guide{background:var(--acb);padding:9px 18px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;
 border-bottom:1px solid var(--bd);font-size:12.5px}
.guide b{color:var(--ac);margin-right:4px}
.guide .st{background:#fff;border:1px solid #c3d5f5;color:var(--ac);padding:4px 11px;border-radius:20px;
 cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.guide .st:hover{background:#d8e5fb;border-color:var(--ac)}
.guide .st.on{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
.guide .st .no{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;
 border-radius:50%;background:#e3ecfb;color:var(--ac);font-size:10.5px;font-weight:600;flex:0 0 auto}
.guide .st.on .no{background:rgba(255,255,255,.28);color:#fff}
.guide .ar{color:#9fb6e0}

.tabs{display:flex;border-bottom:1px solid var(--bd);background:var(--pn);overflow-x:auto}
#tabs{position:sticky;top:0;z-index:30;box-shadow:0 1px 0 var(--bd)}
.tabs button{border:0;background:0;padding:13px 20px;font:inherit;font-size:13.5px;color:var(--tx2);
 cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button:hover{color:var(--tx);background:var(--pn2)}
.tabs button.on{color:var(--ac);border-bottom-color:var(--ac);font-weight:600;background:var(--acb)}
.pg{display:none;padding:22px}
.pg.on{display:block}

h2{font-size:19px;font-weight:600;margin-bottom:4px}
h3{font-size:15px;font-weight:600;margin:22px 0 9px}
h4{font-size:13.5px;font-weight:600;margin:16px 0 7px}
.mut{color:var(--tx3);font-size:12.5px}
.lead{color:var(--tx2);margin-bottom:14px;max-width:82ch}

.bar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;background:var(--pn2);
 border:1px solid var(--bd);border-radius:8px;padding:12px 14px;margin-bottom:16px}
.fg{display:flex;flex-direction:column;gap:4px}
.fg label{font-size:11.5px;color:var(--tx3)}
select,input[type=text],input[type=date]{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--bd2);
 border-radius:6px;background:#fff;color:var(--tx);min-width:110px}
button.b{font:inherit;font-size:13px;padding:6px 13px;border:1px solid var(--bd2);border-radius:6px;background:#fff;cursor:pointer}
button.b:hover{background:var(--pn2)}
button.b.p{background:var(--tx);color:#fff;border-color:var(--tx)}
button.b.p:hover{opacity:.86}
button.b.sm{padding:3px 9px;font-size:12px}

.k{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin-bottom:8px}
.kc{background:var(--pn2);border:1px solid var(--bd);border-radius:8px;padding:11px 13px}
.kc .l{font-size:11.5px;color:var(--tx3);margin-bottom:3px}
.kc .v{font-size:21px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.kc .d{font-size:11.5px;margin-top:2px}
.up{color:var(--ok)}.dn{color:var(--dg)}.fl{color:var(--tx3)}

.gr{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.box{background:var(--pn);border:1px solid var(--bd);border-radius:8px;padding:14px 16px}
.box>h4:first-child{margin-top:0}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-weight:600;color:var(--tx2);font-size:11.5px;padding:7px 8px;
 border-bottom:1.5px solid var(--bd2);white-space:nowrap;background:var(--pn2);position:sticky;top:0;cursor:pointer}
th.na{cursor:default}
td{padding:6px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--pn2)}
tr.clk{cursor:pointer}
.sc{overflow:auto;max-height:460px;border:1px solid var(--bd);border-radius:8px}
.dotr,.doty,.dotg{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
.dotr{background:#d05555}.doty{background:#e0a63c}.dotg{background:#4a9c72}

.tg{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:4px}
.t0{background:var(--dgb);color:var(--dg)}.t1{background:var(--wnb);color:var(--wn)}
.t2{background:var(--acb);color:var(--ac)}.t3{background:var(--okb);color:var(--ok)}
.tm_{background:#eef0f4;color:var(--tx2)}.tp{background:var(--pub);color:var(--pu)}

.nt{border-left:3px solid var(--ac);background:var(--acb);padding:11px 14px;border-radius:0 6px 6px 0;margin:12px 0;font-size:13px}
.nt.w{border-color:var(--wn);background:var(--wnb)}
.nt.d{border-color:var(--dg);background:var(--dgb)}
.nt.o{border-color:var(--ok);background:var(--okb)}
.fake{display:inline-block;background:var(--wnb);color:var(--wn);font-size:11.5px;font-weight:600;
 padding:3px 9px;border-radius:4px;margin-bottom:10px}

.tms{display:grid;grid-template-columns:212px 1fr;border:1px solid var(--bd);border-radius:8px;overflow:hidden;min-height:560px}
.tms .rail{background:var(--tmb);border-right:1px solid var(--bd);padding:12px 0}
.rail .rh{font-size:11.5px;color:var(--tx3);padding:5px 14px;font-weight:600}
.rail .ch{padding:7px 14px;font-size:13px;color:var(--tx2);cursor:pointer;display:flex;gap:8px;align-items:center}
.rail .ch:hover{background:#e6e6f7}
.rail .ch.on{background:#dcdcf5;color:var(--tm);font-weight:600;box-shadow:inset 3px 0 0 var(--tm)}
.rail .ch .av{width:22px;height:22px;border-radius:4px;background:var(--tm);color:#fff;font-size:10px;
 display:flex;align-items:center;justify-content:center;font-weight:600;flex:0 0 auto}
.tms .conv{padding:16px 20px;background:#fff;overflow:auto;max-height:660px}
.msg{display:flex;gap:10px;margin-bottom:16px}
.msg .av{width:30px;height:30px;border-radius:50%;background:var(--tm);color:#fff;font-size:11px;
 display:flex;align-items:center;justify-content:center;font-weight:600;flex:0 0 auto}
.msg .bd_{flex:1;min-width:0}
.msg .hd_{font-size:12.5px;margin-bottom:5px}
.msg .hd_ b{font-size:13.5px}
.msg .hd_ span{color:var(--tx3);margin-left:6px;font-size:11.5px}
.msg .txt{font-size:13.5px;color:var(--tx2)}

.ac{border:1px solid var(--bd);border-radius:8px;background:#fff;margin-top:8px;max-width:660px;overflow:hidden}
.ac .h{padding:11px 15px;border-bottom:1px solid var(--bd);display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.ac .h .t{font-weight:600;font-size:14px;flex:1;min-width:200px}
.ac .b{padding:4px 15px 10px}
.ac .r{display:grid;grid-template-columns:78px 1fr;gap:10px;padding:7px 0;border-bottom:1px solid #f2f4f7;font-size:13px}
.ac .r:last-child{border:0}
.ac .r .kk{color:var(--tx3);font-size:11.5px;padding-top:2px}
.ac .why{background:var(--pub);color:var(--pu);font-size:12px;padding:8px 15px;margin:0 15px 10px;border-radius:6px}
.ac .f{padding:10px 15px;background:var(--pn2);border-top:1px solid var(--bd);display:flex;gap:7px;align-items:center;flex-wrap:wrap}

.fun{display:flex;flex-direction:column;gap:3px}
.fun .s{display:grid;grid-template-columns:150px 1fr 190px;gap:10px;align-items:center;font-size:12.5px}
.fun .bar_{height:30px;border-radius:4px;display:flex;align-items:center;padding-left:9px;color:#fff;font-weight:600;font-size:12px}
.fun .rt{color:var(--tx3);font-size:11.5px;text-align:right}
ul{margin:0 0 10px 19px;color:var(--tx2);font-size:13px}li{margin-bottom:4px}
.chk{display:flex;flex-wrap:wrap;gap:5px 14px;margin:6px 0}
.chk label{font-size:12.5px;color:var(--tx2);display:flex;gap:5px;align-items:center;cursor:pointer}
.pgr{display:flex;gap:6px;align-items:center;margin-top:9px;font-size:12.5px;color:var(--tx2)}

/* ── 管理者檢視 ── */
.top button.adm{font:inherit;font-size:12.5px;color:var(--wn);background:var(--wnb);
 border:1px solid #e8d0a0;padding:4px 12px;border-radius:6px;cursor:pointer;white-space:nowrap}
.top button.adm:hover{background:#fbe9c8}
.mask{position:fixed;inset:0;background:rgba(16,19,24,.5);z-index:200;display:flex;
 align-items:flex-start;justify-content:center;padding:36px 16px;overflow:auto}
.mask.hide{display:none}
.dlg{background:var(--pn);border-radius:12px;width:100%;max-width:1000px;overflow:hidden;
 box-shadow:0 18px 50px rgba(0,0,0,.28)}
.dlg .dh{padding:14px 20px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dlg .dh .t{font-size:16px;font-weight:600}
.dlg .dh .s{font-size:12px;color:var(--tx3)}
.dlg .db{padding:18px 20px 24px}
.pwbox{max-width:340px;margin:26px auto 40px;text-align:center}
.pwbox input{width:100%;text-align:center;font-size:15px;padding:9px 12px;margin:12px 0 10px;
 border:1px solid var(--bd2);border-radius:8px}
.err{color:var(--dg);font-size:12.5px;min-height:18px}
.seg{display:inline-flex;border:1px solid var(--bd2);border-radius:7px;overflow:hidden}
.seg button{border:0;background:#fff;font:inherit;font-size:12.5px;padding:5px 13px;cursor:pointer;color:var(--tx2)}
.seg button+button{border-left:1px solid var(--bd)}
.seg button.on{background:var(--ac);color:#fff}
.sec2{font-size:15px;font-weight:600;margin:26px 0 10px;padding-bottom:7px;border-bottom:2px solid var(--bd)}
.sec2:first-child{margin-top:0}
.bars{display:flex;flex-direction:column;gap:5px}
.brow{display:grid;grid-template-columns:minmax(90px,190px) 1fr 52px;gap:9px;align-items:center;font-size:12.5px}
.btrack{background:#eef0f4;height:15px;border-radius:3px;overflow:hidden}
.bfill{height:15px;border-radius:3px;background:#8fa8d8}
.tr7{display:flex;align-items:flex-end;gap:5px;height:74px}
.tr7 .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.tr7 .b{width:100%;background:#dbeafe;border-radius:4px 4px 0 0}
.tr7 .b.mx{background:var(--ac)}
.tr7 .d{font-size:9.5px;color:var(--tx3)}
.ansbox{background:var(--pn2);border:1px solid var(--bd);border-radius:8px;padding:12px 14px;margin-top:8px;
 max-height:340px;overflow:auto;font-size:12.5px;white-space:pre-wrap;line-height:1.7}
</style>
</head>

/* ===== helpers ===== */
const $=i=>document.getElementById(i);
const F=n=>Math.round(n||0).toLocaleString('en-US');

const MK=['cost','clicks','impr','conv','inq','dl','pur','reg'];
function S0(){const o={};MK.forEach(k=>o[k]=0);return o}
function add(a,b){MK.forEach(k=>a[k]+=(b[k]||0));return a}
function agg(rows){return rows.reduce((a,r)=>add(a,r),S0())}
function der(t){return{...t,
  ctr:t.impr?t.clicks/t.impr:0, cpc:t.clicks?t.cost/t.clicks:0,

function dlt(cur,base,goodDown){
  if(base==null||cur==null||!base)return'<span class="fl">—</span>';
  const d=(cur-base)/base, good=goodDown?d<0:d>0;
  return `<span class="${Math.abs(d)<0.005?'fl':good?'up':'dn'}">${d>0?'+':''}${(d*100).toFixed(1)}%</span>`}

const PER={'2026H1':['2026-01','2026-06'],'2025H1':['2025-01','2025-06'],

/* ===== charts ===== */
function cBarLine(rows,bk,lk,bl,ll){
  if(!rows.length)return'<div class="mut">—</div>';
  const W=780,H=210,PL=56,PR=56,PT=14,PB=40,iw=W-PL-PR,ih=H-PT-PB;
  const bm=Math.max(...rows.map(r=>r[bk]||0))*1.15||1, lm=Math.max(...rows.map(r=>r[lk]||0))*1.15||1;
  const bw=iw/rows.length;
  let s='',pts=[];
  rows.forEach((r,i)=>{
    const h=(r[bk]||0)/bm*ih, x=PL+i*bw+bw*0.18, y=PT+ih-h;
    s+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw*0.64).toFixed(1)}" height="${Math.max(h,0).toFixed(1)}" fill="#c3d2ea" rx="2"/>`;
    pts.push([PL+i*bw+bw/2, PT+ih-(r[lk]||0)/lm*ih]);
    if(rows.length<=14||i%Math.ceil(rows.length/12)===0)
      s+=`<text x="${(PL+i*bw+bw/2).toFixed(1)}" y="${H-22}" font-size="10" fill="#8a93a2" text-anchor="middle">${r.m.slice(2)}</text>`;
  });
  s+=`<polyline fill="none" stroke="#2f5fd0" stroke-width="2" points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}"/>`;
  pts.forEach(p=>s+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6" fill="#2f5fd0"/>`);
  for(let i=0;i<=2;i++){const y=PT+ih-ih*i/2;
    s=`<line x1="${PL}" y1="${y}" x2="${PL+iw}" y2="${y}" stroke="#eef0f4"/>`+s;
    s+=`<text x="${PL-6}" y="${y+3}" font-size="10" fill="#8a93a2" text-anchor="end">${F(bm*i/2)}</text>`;
    s+=`<text x="${PL+iw+6}" y="${y+3}" font-size="10" fill="#2f5fd0">${F(lm*i/2)}</text>`}
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${s}</svg>
   <div style="font-size:11.5px;color:#8a93a2;margin-top:2px"><span style="color:#c3d2ea">■</span> ${bl} &nbsp; <span style="color:#2f5fd0">■</span> ${ll}</div>`}

function cStack(rows,keys,labels,colors){
  const W=780,H=170,PL=10,PT=10,PB=30,iw=W-PL-16,ih=H-PT-PB,bw=iw/rows.length;
  let s='';
  rows.forEach((r,i)=>{
    const tot=keys.reduce((a,k)=>a+(r[k]||0),0)||1;let y=PT+ih;
    keys.forEach((k,j)=>{const h=(r[k]||0)/tot*ih;y-=h;
      s+=`<rect x="${(PL+i*bw+bw*0.15).toFixed(1)}" y="${y.toFixed(1)}" width="${(bw*0.7).toFixed(1)}" height="${h.toFixed(1)}" fill="${colors[j]}"/>`});
    if(rows.length<=14||i%Math.ceil(rows.length/12)===0)
      s+=`<text x="${(PL+i*bw+bw/2).toFixed(1)}" y="${H-14}" font-size="10" fill="#8a93a2" text-anchor="middle">${r.m.slice(2)}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${s}</svg>
   <div style="font-size:11.5px;color:#8a93a2">${labels.map((l,j)=>`<span style="color:${colors[j]}">■</span> ${l}`).join(' &nbsp; ')}</div>`}

function cQuad(items,avg){
  const W=760,H=300,PL=64,PR=20,PT=16,PB=42,iw=W-PL-PR,ih=H-PT-PB;
  const xm=Math.max(...items.map(i=>i.x))*1.12||1, ym=Math.max(...items.map(i=>i.y))*1.12||1;
  const rm=Math.max(...items.map(i=>i.r))||1;
  let s='';
  for(let i=0;i<=3;i++){const y=PT+ih-ih*i/3;s+=`<line x1="${PL}" y1="${y}" x2="${PL+iw}" y2="${y}" stroke="#eef0f4"/>
    <text x="${PL-6}" y="${y+3}" font-size="10" fill="#8a93a2" text-anchor="end">${F(ym*i/3)}</text>`}
  items.forEach(it=>{
    const x=PL+it.x/xm*iw, y=PT+ih-it.y/ym*ih, r=6+Math.sqrt(it.r/rm)*20;
    const c=it.y>avg*2?'#d05555':it.y>avg?'#e0a63c':'#4a9c72';
    s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="${c}" fill-opacity=".28" stroke="${c}"/>
        <text x="${x.toFixed(1)}" y="${(y-r-4).toFixed(1)}" font-size="10" fill="#586170" text-anchor="middle">${it.n}</text>`});
  s+=`<line x1="${PL}" y1="${PT+ih-avg/ym*ih}" x2="${PL+iw}" y2="${PT+ih-avg/ym*ih}" stroke="#8a93a2" stroke-dasharray="4 3"/>
      <text x="${PL+4}" y="${PT+ih-avg/ym*ih-4}" font-size="10" fill="#8a93a2">${T.quadAvg} ¥${F1(avg)}</text>
      <text x="${PL+iw/2}" y="${H-10}" font-size="11" fill="#8a93a2" text-anchor="middle">${T.quadX}</text>
      <text x="14" y="${PT+ih/2}" font-size="11" fill="#8a93a2">${T.quadY}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${s}</svg><div class="mut">${T.quadNote}</div>`}

/* 題目對照：從問卷語言包取當前語言的題目文字 */
function qMap(){
 const m={};
 try{const S=SURVEY[LANG]||SURVEY.cn;
  S.sec.forEach(sec=>sec.qs.forEach((q,i)=>{m[q.id]={no:sec.s+(i+1),q:q.q,ty:q.ty,o:q.o,rows:q.rows,cols:q.cols,
   groups:q.groups,optsA:q.optsA,optsB:q.optsB,qCols:q.qCols}}))
 }catch(e){}
 return m}

function ansText(qi,v){
 if(v==null||v==='')return '';
 if(!qi)return typeof v==='object'?JSON.stringify(v):String(v);
 if(qi.ty==='r'){const o=qi.o||[];return o[+v]!==undefined?o[+v]:String(v)}
 if(qi.ty==='c'){const o=qi.o||[];return String(v).split('|').filter(x=>x!=='').map(x=>o[+x]!==undefined?o[+x]:x).join(' / ')}
 if(qi.ty==='m'&&typeof v==='object'){
  const rows=qi.rows||[],cols=qi.cols||[],out=[];
  rows.forEach((r,ri)=>{const cells=cols.map((c,ci)=>v[ri+'_'+ci]||'').filter(x=>String(x).trim());
   if(cells.length)out.push(r+'：'+cells.join(' ／ '))});
  return out.join('\n')}
 if(qi.ty==='g'&&typeof v==='object'){
  const out=[];let ri=0;
  (qi.groups||[]).forEach(grp=>grp.rows.forEach(r=>{
   const idx=ri++,av=v[idx+'_a'],bv=v[idx+'_b'];
   const at=(av!==undefined&&av!=='')?(qi.optsA||[])[+av]:'',bt=(bv!==undefined&&bv!=='')?(qi.optsB||[])[+bv]:'';
   if(at||bt)out.push(r.label+'：'+(at||'—')+' ／ '+(bt||'—'))}));
  return out.join('\n')}
 return String(v)}

function bars(obj,labeler){
 const A=AD(),ent=Object.entries(obj||{}).sort((a,b)=>b[1]-a[1]);
 if(!ent.length)return `<div class="mut">${A.noData}</div>`;
 const mx=Math.max(...ent.map(e=>e[1]))||1;
 return `<div class="bars">${ent.map(([k,v])=>`<div class="brow">
  <div>${labeler?labeler(k):k}</div>
  <div class="btrack"><div class="bfill" style="width:${(v/mx*100).toFixed(1)}%"></div></div>
  <div class="n" style="text-align:right;font-weight:600">${F(v)}</div></div>`).join('')}</div>`}

function trend7(tr){
 const d=Object.entries(tr||{});if(!d.length)return '';
 const mx=Math.max(...d.map(x=>x[1]),1);
 return `<div class="tr7">${d.map(([day,c])=>`<div class="c">
  <div class="b${c===mx&&mx>0?' mx':''}" style="height:${Math.max(c/mx*58,c>0?4:0).toFixed(0)}px"></div>
  <div class="d">${day}</div></div>`).join('')}</div>`}

function admSurvey(sv){
 const A=AD(),M=qMap(),rs=sv.responses||[];
 const K=(l,v)=>`<div class="kc"><div class="l">${l}</div><div class="v">${v}</div></div>`;
 let out=`<div class="k">${K(A.k1[0],F(sv.count||0))}${K(A.k1[1],(sv.avg_completion||0)+'%')}${K(A.k1[2],sv.last_ts||'—')}</div>`;

 if(!rs.length)return out+`<div class="nt" style="margin-top:14px">${A.noResp}</div>`;

 out+=`<h4>${A.listT}</h4><div class="sc" style="max-height:260px"><table><thead><tr>${
  A.listTh.map((h,i)=>`<th class="${i===4?'n ':''}na">${h}</th>`).join('')}</tr></thead><tbody>${
  rs.map(r=>`<tr><td>${r.ts}</td><td><b>${r.name||'—'}</b></td><td>${r.bu||'—'}</td>
   <td><span class="tg tm_">${r.lang||'—'}</span></td><td class="n">${r.pct}%</td>
   <td><button class="b sm" onclick="admToggle('${r.id}')">${A.view}</button></td></tr>
   <tr id="d-${r.id}" style="display:none"><td colspan="6"><div class="ansbox">${
    Object.entries(r.answers||{}).map(([qid,v])=>{
     const qi=M[qid],t=ansText(qi,v);
     if(!String(t).trim())return '';
     return `<b>${qi?qi.no+'. '+qi.q:qid}</b>\n${t}`}).filter(Boolean).join('\n\n')||A.noData
   }</div></td></tr>`).join('')}</tbody></table></div>`;

 // 橫向比較
 const qids=[];rs.forEach(r=>Object.keys(r.answers||{}).forEach(q=>{if(!qids.includes(q))qids.push(q)}));
 const ordered=qids.sort((a,b)=>{const x=M[a],y=M[b];return (x?x.no:a)<(y?y.no:b)?-1:1});
 out+=`<h4 style="margin-top:22px">${A.crossT}</h4>
 <div class="nt">${A.crossHint}</div>
 <div class="sc"><table><thead><tr><th class="na" style="min-width:210px">${A.crossTh}</th>${
  rs.map(r=>`<th class="na">${r.name||'—'}</th>`).join('')}</tr></thead><tbody>${
  ordered.map(qid=>{const qi=M[qid];
   const cells=rs.map(r=>ansText(qi,(r.answers||{})[qid]));
   if(!cells.some(c=>String(c).trim()))return '';
   return `<tr><td style="white-space:normal"><b>${qi?qi.no:qid}</b> ${qi?qi.q:''}</td>${
    cells.map(c=>`<td style="white-space:pre-wrap;max-width:260px">${c||'<span class="mut">—</span>'}</td>`).join('')}</tr>`
  }).filter(Boolean).join('')}</tbody></table></div>`;

 // 最常被跳過
 const miss=Object.entries(sv.missing||{}).sort((a,b)=>b[1]-a[1]).slice(0,8);
 if(miss.length)out+=`<h4 style="margin-top:22px">${A.missT}</h4>
  <div class="nt w">${A.missHint}</div>
  <div class="sc" style="max-height:220px"><table><thead><tr>${
   A.missTh.map((h,i)=>`<th class="${i?'n ':''}na">${h}</th>`).join('')}</tr></thead><tbody>${
   miss.map(([qid,n])=>{const qi=M[qid];
