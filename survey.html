<style>
body{font:14px/1.75 "Microsoft YaHei","PingFang SC","Segoe UI",Arial,sans-serif;background:#f3f4f7;color:#16191d;margin:0}
body.en{font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif}
body.tw{font-family:"Microsoft JhengHei","PingFang TC","Segoe UI",Arial,sans-serif}
.hd{background:#fff;color:#16191d;padding:0 18px;display:flex;align-items:center;gap:12px;min-height:58px;
 border-bottom:1px solid #e3e6ec;position:sticky;top:0;z-index:9;flex-wrap:wrap}
.hd img{height:30px;display:block}.hd .nm{font-weight:600;font-size:15px}.hd .sp{flex:1}
.hd a{color:#004280;font-size:13px;text-decoration:none;border:1px solid #b9cde3;padding:4px 12px;border-radius:6px;white-space:nowrap}
.hd a:hover{background:#eaf0fa}
.hd select{font:inherit;font-size:12.5px;padding:5px 8px;border:1px solid #b9cde3;border-radius:6px;background:#fff;color:#004280;cursor:pointer;min-width:104px}
.w{max-width:880px;margin:0 auto;padding:22px 22px 84px}
.c{background:#fff;border:1px solid #e3e6ec;border-radius:10px;padding:20px 24px;margin-bottom:16px}
h2{font-size:16px;font-weight:600;margin:0 0 3px;color:#004280}
.intro{border-left:3px solid #004280;background:#eaf0fa;padding:14px 18px;border-radius:0 8px 8px 0;margin-bottom:18px}
.intro p{margin:0 0 8px}.intro p:last-child{margin:0}
.warn{border-left:3px solid #96600a;background:#fdf2df;padding:14px 18px;border-radius:0 8px 8px 0;margin-bottom:16px}
.q{padding:14px 0;border-bottom:1px solid #eef0f4}.q:last-child{border:0;padding-bottom:0}
.qt{font-weight:600;font-size:14px;margin-bottom:3px}
.qt .n{color:#8a93a2;font-weight:400;margin-right:6px}
.hint{color:#8a93a2;font-size:12.5px;margin-bottom:8px}
.star{color:#ad3434;font-size:12px;margin-left:5px}
input[type=text],textarea{font:inherit;font-size:13.5px;width:100%;padding:7px 10px;border:1px solid #ccd2dc;
 border-radius:6px;background:#fff;color:#16191d;resize:vertical}
input[type=text]:focus,textarea:focus{outline:2px solid #a9c4ee;outline-offset:-1px;border-color:#004280}
textarea{min-height:74px;line-height:1.6}
.opt{display:block;padding:4px 0;font-size:13.5px;color:#3a4250;cursor:pointer}
.opt input{margin-right:7px}
.oi{display:inline-block;width:160px;margin-left:6px;padding:3px 7px!important;font-size:13px!important}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
th{text-align:left;font-size:11.5px;color:#586170;padding:6px 8px;border-bottom:1.5px solid #ccd2dc;background:#fafbfc}
td{padding:5px 8px;border-bottom:1px solid #eef0f4;vertical-align:middle}
td input[type=text]{padding:5px 8px;font-size:13px}
.sm{font-size:12.5px;color:#8a93a2}
select{font:inherit;font-size:13px;padding:6px 8px;border:1px solid #ccd2dc;border-radius:6px;background:#fff;width:100%;max-width:200px}
.gtab td.gq{width:42%}
.gtab td.gq b{font-size:13.5px}
.gtab td.gq .how{display:block;color:#8a93a2;font-size:12px;margin-top:2px}
.gtab tr.grp td{background:#f6f8fb;font-size:12px;font-weight:600;color:#004280;padding:7px 9px;border-bottom:1px solid #e3e6ec}
.q.err{background:#fdeeee;border-radius:8px;margin:0 -12px;padding:14px 12px;box-shadow:inset 3px 0 0 #ad3434}
.q.err .qt{color:#ad3434}
.reqerr{color:#ad3434;font-size:12px;margin-top:6px;display:none}
.q.err .reqerr{display:block}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e3e6ec;padding:10px 22px;
 display:flex;gap:10px;align-items:center;z-index:9;flex-wrap:wrap}
.bar .sp{flex:1}
button.b{font:inherit;font-size:13.5px;padding:7px 16px;border:1px solid #ccd2dc;border-radius:7px;background:#fff;cursor:pointer}
button.b:hover{background:#f7f8fa}
button.b.p{background:#004280;color:#fff;border-color:#004280}button.b.p:hover{opacity:.88}
.done{color:#1a7a4f;font-size:13px}

<script>
let LANG='cn',S=SURVEY.cn;
const K='adv_sem_survey_v2';
let LS=null;
try{localStorage.setItem('__t','1');localStorage.removeItem('__t');LS=localStorage}catch(e){LS=null}
let A={};
try{A=JSON.parse((LS&&LS.getItem(K))||'{}')||{}}catch(e){A={}}
function sv(){try{if(LS)LS.setItem(K,JSON.stringify(A))}catch(e){}prog()}

function allQ(){return S.sec.flatMap(x=>x.qs)}
function prog(){
 let tot=0,fil=0;
 allQ().forEach(q=>{tot++;const v=A[q.id];
  if(v&&(typeof v==='string'?v.trim():Object.values(v).some(x=>x&&String(x).trim())))fil++});
 document.getElementById('prog').textContent=S.ui.prog(fil,tot)}

function esc(s){return String(s).replace(/"/g,'&quot;')}
function render(){
 document.title=S.title;
 document.getElementById('hNm').textContent=S.nm;
 const p=document.getElementById('lProto'),a=document.getElementById('lArch');
 p.textContent=S.lProto;p.href='index.html?lang='+LANG;
 a.textContent=S.lArch;a.href='architecture.html?lang='+LANG;
 document.getElementById('bClr').textContent=S.ui.clear;
 document.getElementById('bMd').textContent=S.ui.expMd;
 document.getElementById('bSub').textContent=AD().submit;

 document.getElementById('head').innerHTML=
  `<div class="intro"><p><b>${S.introH}</b></p>${S.intro.map(x=>`<p>${x}</p>`).join('')}
   <p class="sm">${S.introMeta}</p></div>`+(LS?'':`<div class="warn">${S.warn}</div>`);

 document.getElementById('form').innerHTML=S.sec.map(sec=>`<div class="c">
  <h2>${sec.s}｜${sec.t}${sec.star?`<span class="star">${S.ui.star}</span>`:''}</h2>
  ${sec.note?`<p class="hint" style="margin-bottom:10px">${sec.note}</p>`:'<div style="height:6px"></div>'}
  ${sec.qs.map((q,i)=>{
   const n=`${sec.s}${i+1}`;let body='';
   if(q.ty==='t')body=`<input type="text" value="${esc(A[q.id]||'')}" oninput="A['${q.id}']=this.value;sv()">`;
   if(q.ty==='a')body=`<textarea oninput="A['${q.id}']=this.value;sv()">${A[q.id]||''}</textarea>`;
   if(q.ty==='r')body=q.o.map((o,oi)=>`<label class="opt"><input type="radio" name="${q.id}" ${A[q.id]===String(oi)?'checked':''} onchange="A['${q.id}']='${oi}';sv()">${o}${q.oth&&oi===q.o.length-1?`<input type="text" class="oi" placeholder="${S.ui.other}" value="${esc(A[q.id+'_o']||'')}" oninput="A['${q.id}_o']=this.value;sv()">`:''}</label>`).join('');
   if(q.ty==='c')body=q.o.map((o,oi)=>`<label class="opt"><input type="checkbox" ${((A[q.id]||'').split('|')).includes(String(oi))?'checked':''} onchange="tgc(this,'${q.id}','${oi}',${q.max||0})">${o}${q.oth&&oi===q.o.length-1?`<input type="text" class="oi" placeholder="${S.ui.other}" value="${esc(A[q.id+'_o']||'')}" oninput="A['${q.id}_o']=this.value;sv()">`:''}</label>`).join('');
   if(q.ty==='m'){A[q.id]=A[q.id]||{};
    body=`<table><thead><tr><th></th>${q.cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>
     ${q.rows.map((r,ri)=>`<tr><td style="width:38%">${r}</td>${q.cols.map((c,ci)=>{
      const kk=ri+'_'+ci;return `<td><input type="text" value="${esc((A[q.id]||{})[kk]||'')}" oninput="mset('${q.id}','${kk}',this.value)"></td>`}).join('')}</tr>`).join('')}
    </tbody></table>`}
   if(q.ty==='g'){A[q.id]=A[q.id]||{};
    let ri=0,rows='';
    q.groups.forEach(grp=>{
     rows+=`<tr class="grp"><td colspan="3">${grp.title}</td></tr>`;
     grp.rows.forEach(r=>{
      const idx=ri++,va=(A[q.id]||{})[idx+'_a'],vb=(A[q.id]||{})[idx+'_b'];
      rows+=`<tr><td class="gq"><b>${r.label}</b><span class="how">${r.how}</span></td>
       <td><select onchange="gset('${q.id}',${idx},'a',this.value)"><option value=""></option>${
        q.optsA.map((o,oi)=>`<option value="${oi}" ${String(oi)===String(va)?'selected':''}>${o}</option>`).join('')}</select></td>
       <td><select onchange="gset('${q.id}',${idx},'b',this.value)"><option value=""></option>${
        q.optsB.map((o,oi)=>`<option value="${oi}" ${String(oi)===String(vb)?'selected':''}>${o}</option>`).join('')}</select></td></tr>`});
    });
    body=`<table class="gtab"><thead><tr>${q.qCols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>`}
   return `<div class="q" id="q-${q.id}"><div class="qt"><span class="n">${n}</span>${q.q}</div>
    ${q.h?`<div class="hint">${q.h}</div>`:''}${body}<div class="reqerr">${S.ui.needAll}</div></div>`}).join('')}
 </div>`).join('')+`<p class="sm" style="padding:0 4px">${S.ui.end}</p>`;
 prog()}

function tgc(el,id,oi,max){
 const cur=(A[id]||'').split('|').filter(x=>x!=='');
 const i=cur.indexOf(oi);
 if(i<0){
  if(max&&cur.length>=max){el.checked=false;return}
  cur.push(oi);
 } else cur.splice(i,1);
 A[id]=cur.join('|');sv()}
function mset(id,k,v){A[id]=A[id]||{};A[id][k]=v;sv()}
function gset(id,idx,which,v){A[id]=A[id]||{};A[id][idx+'_'+which]=v;sv()}
function clr(){if(confirm(S.ui.confirm)){A={};try{if(LS)LS.removeItem(K)}catch(e){}render()}}

/* ── 必填驗證：全部題目都要填，送出前擋下並跳到第一個未填處 ── */
function isFilled(q){
 const v=A[q.id];
 if(q.ty==='m'){
  if(!v)return false;
  return q.rows.every((r,ri)=>q.cols.every((c,ci)=>String(v[ri+'_'+ci]||'').trim()!==''));
 }
 if(q.ty==='g'){
  if(!v)return false;
  let ri=0;
  return q.groups.every(grp=>grp.rows.every(()=>{
   const idx=ri++,va=v[idx+'_a'],vb=v[idx+'_b'];
   return va!==undefined&&va!==''&&vb!==undefined&&vb!=='';
  }));
 }
 if(q.ty==='r')return v!==undefined&&v!=='';
 if(q.ty==='c'){const arr=(v||'').split('|').filter(x=>x!=='');return arr.length>0}
 return typeof v==='string'&&v.trim()!=='';}

function findMissing(){
 for(const sec of S.sec)for(const q of sec.qs)if(!isFilled(q))return q;
 return null}

function goToMissing(q){
 document.querySelectorAll('.q.err').forEach(e=>e.classList.remove('err'));
 const el=document.getElementById('q-'+q.id);
 if(el){el.classList.add('err');el.scrollIntoView({behavior:'smooth',block:'center'})}}

function exp(){
 const o=[`# ${S.ui.expTitle}`,'',
  `${S.ui.expBy}: ${A.a1||S.ui.unfilled}`,`${S.ui.expBU}: ${A.a3||S.ui.unfilled}`,''];
 S.sec.forEach(sec=>{o.push('',`## ${sec.s}｜${sec.t}`,'');
  sec.qs.forEach((q,i)=>{o.push(`**${sec.s}${i+1}. ${q.q}**`);
   const v=A[q.id];
   if(q.ty==='m'){const m=v||{};
    o.push('','| | '+q.cols.join(' | ')+' |','|---|'+q.cols.map(()=>'---|').join(''));
    q.rows.forEach((r,ri)=>o.push('| '+r+' | '+q.cols.map((c,ci)=>(m[ri+'_'+ci]||'')).join(' | ')+' |'))}
   else if(q.ty==='g'){const m=v||{};
    o.push('','| | '+q.qCols[1]+' | '+q.qCols[2]+' |','|---|---|---|');
    let ri=0;
    q.groups.forEach(grp=>{o.push('| **'+grp.title+'** | | |');
     grp.rows.forEach(r=>{const idx=ri++,av=m[idx+'_a'],bv=m[idx+'_b'];
      const at=(av!==undefined&&av!=='')?q.optsA[+av]:'',bt=(bv!==undefined&&bv!=='')?q.optsB[+bv]:'';
      o.push('| '+r.label+' | '+(at||S.ui.unfilled)+' | '+(bt||S.ui.unfilled)+' |')})})}
   else if(q.ty==='r'){let t=(v!==undefined&&v!=='')?q.o[+v]:'';
    if(A[q.id+'_o'])t+=`（${A[q.id+'_o']}）`;o.push('',t||S.ui.unfilled)}
   else if(q.ty==='c'){let t=(v||'').split('|').filter(x=>x!=='').map(x=>q.o[+x]).join(' / ');
    if(A[q.id+'_o'])t+=`（${A[q.id+'_o']}）`;o.push('',t||S.ui.unfilled)}
   else o.push('',(v||'').trim()||S.ui.unfilled);
   o.push('')})});
 const a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob(['﻿'+o.join('\n')],{type:'text/markdown;charset=utf-8'}));
 a.download=`${S.ui.fileName}_${(A.a1||S.ui.unnamed).replace(/[^\w一-龥]/g,'')}.md`;a.click()}

function setLang(l){if(!SURVEY[l])return;LANG=l;S=SURVEY[l];document.body.className=l;
 document.documentElement.lang=l==='en'?'en':(l==='tw'?'zh-TW':'zh-CN');
 const s=document.getElementById('langSel');if(s)s.value=l;render()}

function AD(){return ADM[LANG]||ADM.cn}
const SKEY='adv_ads_sid';
function sid(){
 try{let v=localStorage.getItem(SKEY);
  if(!v){v=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():String(Date.now())+Math.random().toString(36).slice(2);
   localStorage.setItem(SKEY,v)}
  return v}catch(e){return 'nostore'}}
function logEv(type,detail){
 try{fetch('api/log',{method:'POST',headers:{'Content-Type':'application/json'},keepalive:true,
  body:JSON.stringify({type:type,detail:String(detail||''),lang:LANG,session_id:sid()})}).catch(function(){})}catch(e){}}

function counts(){
 let tot=0,fil=0;
 S.sec.forEach(sec=>sec.qs.forEach(q=>{tot++;const v=A[q.id];
  if(v&&(typeof v==='string'?v.trim():Object.values(v).some(x=>x&&String(x).trim())))fil++}));
 return{tot:tot,fil:fil}}

async function submitSurvey(){
 const AA=AD(),msg=document.getElementById('subMsg'),btn=document.getElementById('bSub');
 const missing=findMissing();
 if(missing){goToMissing(missing);msg.style.color='#ad3434';msg.textContent=S.ui.needAll;return}
 if(location.protocol==='file:'){msg.style.color='#96600a';msg.textContent=AA.offlineNote;return}
 const c=counts();
 btn.disabled=true;msg.style.color='#586170';msg.textContent=AA.submitting;
 try{
  const r=await fetch('api/survey',{method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({name:A.a1,bu:A.a3||'',lang:LANG,session_id:sid(),
    filled:c.fil,total:c.tot,answers:A})});
  if(!r.ok)throw new Error('HTTP '+r.status);
  msg.style.color='#1a7a4f';msg.textContent=AA.submitOK;
  logEv('survey_submit',String(c.fil)+'/'+String(c.tot));
 }catch(e){msg.style.color='#ad3434';msg.textContent=AA.submitFail}
 btn.disabled=false}

(function(){let q=null;try{q=new URLSearchParams(location.search).get('lang')}catch(e){}
 setLang(SURVEY[q]?q:'cn');logEv('open','survey')})();
</script></body></html>
