.hd{background:#fff;color:#16191d;padding:0 18px;display:flex;align-items:center;gap:14px;min-height:58px;border-bottom:1px solid #e3e6ec;flex-wrap:wrap}
.hd img{height:30px;display:block}

.hd a:hover{background:#eaf0fa}
.hd select{font:inherit;font-size:12.5px;padding:5px 8px;border:1px solid #b9cde3;border-radius:6px;background:#fff;color:#004280;cursor:pointer;min-width:104px}
.w{max-width:1000px;margin:0 auto;padding:24px 24px 60px}
.c{background:#fff;border:1px solid #e3e6ec;border-radius:10px;padding:22px 26px;margin-bottom:20px}

.arr{stroke:#9aa3b2;stroke-width:1.5;fill:none}

.cg rect{fill:#eff1f4;stroke:#8a93a2;stroke-width:.5}.cg .th{fill:#3a4250}.cg .ts{fill:#586170}
.lg{font-size:12.5px;color:#586170;margin-top:8px}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
th{text-align:left;font-size:11.5px;color:#586170;padding:7px 9px;border-bottom:1.5px solid #ccd2dc;background:#fafbfc}
td{padding:7px 9px;border-bottom:1px solid #e3e6ec;vertical-align:top}

.tl{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.tlc{border:1px solid #e3e6ec;border-radius:8px;background:#fafbfc;cursor:pointer;overflow:hidden;transition:border-color .15s}
.tlc:hover{border-color:#b9cde3}
.tlc.open{border-color:#8a93a2}
.tlc .hd_{display:flex;align-items:center;gap:12px;padding:13px 16px}
.tlc .no{font-size:11.5px;color:#8a93a2;white-space:nowrap;min-width:52px}
.tlc .nm_{font-size:15px;font-weight:600;flex:1;min-width:0}
.chip{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;white-space:nowrap}
.chip.done{background:#e4f3ec;color:#1a7a4f}
.chip.active{background:#fdf2df;color:#96600a}
.chip.blocked{background:#fbebeb;color:#ad3434}
.chip.todo{background:#eff1f4;color:#8a93a2}
.tlc .car{font-size:12px;color:#8a93a2;transition:transform .15s}
.tlc.open .car{transform:rotate(90deg)}
.tlc .bd_{max-height:0;overflow:hidden;transition:max-height .2s ease}
.tlc.open .bd_{max-height:2600px}
.tlc .bdi{padding:0 16px 16px;border-top:1px solid #e3e6ec;margin-top:2px;padding-top:12px}

.tlc .lbl:first-child{margin-top:0}
.tlc .goal_{font-size:13.5px;color:#16191d;line-height:1.6}
.intgrow{padding:8px 0;border-bottom:1px solid #eef0f4}
.intgrow:last-child{border-bottom:0}
.intgn{font-size:13.5px;font-weight:600;color:#16191d}
.intgp{font-size:12.5px;color:#586170;margin-top:3px;line-height:1.6}

.depw{font-size:12px;color:#8a93a2;margin-top:2px;line-height:1.5}

.donecrit{font-size:13px;color:#586170;line-height:1.6}

<script>
let LANG='cn',A=ARCH.cn;
const MARK='<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#9aa3b2" stroke-width="1.5" stroke-linecap="round"/></marker></defs>';
const CLS={g:'cg',p:'cp',t:'ct'};

function diag1(){
 const W=680,LW=138,RX=180,RW=440,GAP=20;
 let y=20,s=MARK,fbFrom=null,fbTo=null;
 A.rows.forEach((r,i)=>{
  const lines=r[2],h=Math.max(54,26+lines.length*18+8);
  s+=`<g class="${CLS[r[3]]}"><rect x="40" y="${y}" width="${LW}" height="${h}" rx="4"/><text class="th" x="54" y="${y+h/2+5}">${r[0]}</text></g>`;
  s+=`<g><rect class="box" x="${RX}" y="${y}" width="${RW}" height="${h}" rx="4"/><text class="th" x="${RX+16}" y="${y+26}">${r[1]}</text>`;
  lines.forEach((l,j)=>s+=`<text class="ts" x="${RX+16}" y="${y+46+j*18}">${l}</text>`);
  s+='</g>';
  if(i===3)fbTo=y+h/2;
  if(i===A.rows.length-1)fbFrom=y+h/2;
  if(i<A.rows.length-1)s+=`<line class="arr" x1="330" y1="${y+h}" x2="330" y2="${y+h+GAP-2}" marker-end="url(#a)"/>`;
  y+=h+GAP});
 s+=`<path class="arr" d="M620 ${fbFrom} H640 V${fbTo} H628" marker-end="url(#a)"/>`;
 A.fb.split('').forEach((ch,i)=>s+=`<text class="ts" x="646" y="${(fbFrom+fbTo)/2+i*15}">${ch}</text>`);
 return `<svg width="100%" viewBox="0 0 ${W} ${y}" role="img">${s}</svg>`}

function box(cls,x,y,w,h,lines,mid){
 const cx=x+w/2;
 let s=`<g class="${cls}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4"/>`;
 s+=`<text class="th" x="${cx}" y="${y+22}" text-anchor="middle">${lines[0]}</text>`;
 lines.slice(1).forEach((l,i)=>s+=`<text class="ts" x="${cx}" y="${y+40+i*16}" text-anchor="middle">${l}</text>`);
 return s+'</g>'}

function diag2(){
 const d=A.d2;let s=MARK;
 s+=box('cg',40,20,280,60,d.ad);
 s+=box('cg',335,20,140,60,d.ga);
 s+=box('cg',490,20,150,60,d.crm);
 s+=`<path class="arr" d="M180 80 V90 M405 80 V90 M565 80 V90 M180 90 H565"/>`;
 s+=`<line class="arr" x1="340" y1="90" x2="340" y2="110" marker-end="url(#a)"/>`;
 s+=box('cp',190,110,300,46,d.col);
 s+=`<line class="arr" x1="340" y1="156" x2="340" y2="174" marker-end="url(#a)"/>`;
 s+=box('cp',190,174,300,46,d.wh);
 s+=`<line class="arr" x1="340" y1="220" x2="340" y2="238" marker-end="url(#a)"/>`;
 s+=box('cp',190,238,300,60,d.sem);
 s+=`<line class="arr" x1="340" y1="298" x2="340" y2="314"/>
     <path class="arr" d="M340 314 H180 V326" marker-end="url(#a)"/>
     <path class="arr" d="M340 314 H500 V326" marker-end="url(#a)"/>`;
 s+=box('ct',40,326,280,52,d.bi);
 s+=box('cp',360,326,280,52,d.ag);
 s+=`<line class="arr" x1="500" y1="378" x2="500" y2="396" marker-end="url(#a)"/>`;
 s+=box('ct',360,396,280,52,d.tm);
 s+=`<line class="arr" x1="500" y1="448" x2="500" y2="466" marker-end="url(#a)"/>`;
 s+=box('ct',360,466,280,52,d.log);
 s+=`<path class="arr" d="M360 492 H340 V352 H352" marker-end="url(#a)"/>`;
 return `<svg width="100%" viewBox="0 0 680 540" role="img">${s}</svg>`}

const SW=['background:#eff1f4;border:1px solid #8a93a2','background:#efecfa;border:1px solid #5b47ab','background:#e4f3ec;border:1px solid #1a7a4f'];
function legend(arr){return `<div class="lg">${arr.map((l,i)=>`<span class="sw" style="${SW[i]}"></span>${l}`).join('&nbsp;&nbsp;')}</div>`}
function tbl(th,rows){return `<table><thead><tr>${th.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${
 rows.map(r=>`<tr>${r.map((c,i)=>`<td>${i===0?'<b>'+c+'</b>':c}</td>`).join('')}</tr>`).join('')}</tbody></table>`}

const TL={open:0};
function tlToggle(i){TL.open=TL.open===i?-1:i;renderTimeline()}
function renderTimeline(){
 const el=document.getElementById('tl');if(!el)return;
 const L=A.secLbl;
 el.innerHTML=A.phases.map((p,i)=>{
  const isOpen=TL.open===i;
  return `<div class="tlc${isOpen?' open':''}" onclick="tlToggle(${i})">
   <div class="hd_"><span class="no">${p.n}</span><span class="nm_">${p.t}</span>
    <span class="chip ${p.status}">${(A.stLg.find(s=>s[0]===p.status)||['',p.status])[1]}</span>
    <span class="car">▸</span></div>
   <div class="bd_"><div class="bdi">
    <div class="lbl">${L.intro}</div>
    <div class="goal_">${p.intro}</div>
    <div class="lbl">${L.integ}</div>
    ${p.integ.map(d=>`<div class="intgrow"><div class="intgn">${d[0]}</div><div class="intgp">${d[1]}</div></div>`).join('')}
    <div class="lbl">${L.prep}</div>
    ${p.prep.map(d=>`<div class="deprow"><span class="dot_ ${d[2]}"></span><div><div class="depn">${d[0]}</div><div class="depw">${d[1]}</div></div></div>`).join('')}
    <div class="lbl">${L.outcome}</div>
    <div class="donecrit">${p.outcome}</div>
    <div class="lbl">${L.why}</div>
    <div class="donecrit">${p.why}</div>
   </div></div></div>`}).join('')}

function timeline(){
 return `<div class="tl" id="tl"></div>
 <div class="stlg">${A.stLg.map(s=>`<span><span class="dot_ ${s[0]}"></span>${s[1]}</span>`).join('')}</div>`}

function render(){
 document.title=A.title;
 document.getElementById('hNm').textContent=A.nm;
 document.getElementById('lProto').textContent=A.lProto;
 document.getElementById('lProto').href='index.html?lang='+LANG;
 document.getElementById('lSur').textContent=A.lSur;
 document.getElementById('lSur').href='survey.html?lang='+LANG;
 document.getElementById('main').innerHTML=`
 <div class="c"><h1>${A.h1}</h1><p>${A.p1}</p>${diag1()}${legend(A.lg)}</div>
 <div class="c"><h1>${A.h2}</h1><p>${A.p2}</p>${diag2()}${legend(A.lg2)}</div>
 <div class="c"><h2>${A.h3}</h2>${tbl(A.th3,A.r3)}<p class="mut" style="margin-top:12px">${A.n3}</p></div>
 <div class="c"><h2>${A.h4}</h2>${tbl(A.th4,A.r4)}<p class="mut" style="margin-top:12px">${A.n4}</p></div>
 <div class="c"><h1>${A.h5}</h1><p>${A.p5}</p>${timeline()}</div>`;
 renderTimeline()}

function setLang(l){if(!ARCH[l])return;LANG=l;A=ARCH[l];document.body.className=l;
 document.documentElement.lang=l==='en'?'en':(l==='tw'?'zh-TW':'zh-CN');
 const s=document.getElementById('langSel');if(s)s.value=l;render()}

(function(){let q=null;try{q=new URLSearchParams(location.search).get('lang')}catch(e){}
 setLang(ARCH[q]?q:'cn')})();
</script></body></html>
